<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Louvor Jovens</title>
<meta name="theme-color" content="#120c08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Visual de player: carrossel de capas em vidro sobre um fundo desfocado que muda de cor com a música.
   Tema escuro único, escolhido de propósito (como num app de música). Vidro = aproximação web com backdrop-filter. */
@property --c1 { syntax: "<color>"; inherits: true; initial-value: #b8661c; }
@property --c2 { syntax: "<color>"; inherits: true; initial-value: #5a2410; }
:root {
  --ink: #120c08;
  --fg: #fbf3ea;
  --muted: rgb(251 243 234 / .62);
  --faint: rgb(251 243 234 / .14);
  --glass: rgb(255 240 225 / .10);
  --glass-strong: rgb(30 18 10 / .55);
  --edge: rgb(255 240 225 / .22);
  --accent: #ffb054;
  --ok: #7be0a6; --warn: #ffc670; --bad: #ff8f80; --new: #ffb054;
  --font: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 22px;
  color-scheme: dark;
  transition: --c1 .9s ease, --c2 .9s ease;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ink); color: var(--fg); font: 15px/1.45 var(--font);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
button { font: inherit; color: inherit; }
svg.i { width: 1em; height: 1em; fill: currentColor; flex: none; }

/* fundo */
.bg { position: fixed; inset: -10%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(40% 45% at 30% 30%, var(--c1), transparent 70%),
    radial-gradient(45% 50% at 75% 70%, var(--c2), transparent 70%),
    radial-gradient(60% 60% at 50% 45%, color-mix(in srgb, var(--c1) 55%, var(--ink)), var(--ink) 80%);
  filter: blur(50px) saturate(1.1);
}
.bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 45%, transparent 30%, rgb(10 6 4 / .75)); }

.app { position: relative; z-index: 1; overflow-x: clip; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
.wrap { width: 100%; max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* topo */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 6px; }
.brand { font-weight: 700; font-size: 20px; letter-spacing: -.02em; margin: 0; }
.brand span { color: var(--muted); font-weight: 500; }
.sync { font-size: 12px; color: var(--muted); display: block; font-weight: 500; letter-spacing: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; cursor: pointer;
  background: var(--glass); border: 1px solid var(--edge); font-size: 18px;
  backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .18); transition: transform .15s ease; }
.icon-btn:active { transform: scale(.94); }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.top-actions { display: flex; gap: 8px; }

/* eventos */
.events { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 10px 4px; scroll-snap-type: x proximity; }
.events::-webkit-scrollbar { display: none; }
.ev { flex: none; scroll-snap-align: center; cursor: pointer; text-align: left; border-radius: 999px; padding: 8px 14px;
  background: rgb(255 240 225 / .07); border: 1px solid var(--faint); color: var(--muted); line-height: 1.15; }
.ev b { display: block; color: var(--fg); font-weight: 600; font-size: 14px; }
.ev small { font-size: 12px; font-variant-numeric: tabular-nums; }
.ev[aria-pressed="true"] { background: var(--fg); color: rgb(18 12 8 / .7); border-color: var(--fg); }
.ev[aria-pressed="true"] b { color: var(--ink); }
.ev .nx { color: var(--accent); font-weight: 600; }
.ev[aria-pressed="true"] .nx { color: #a3530a; }
.mo { flex: none; align-self: center; font-size: 12px; color: var(--muted); padding: 0 4px 0 8px; font-weight: 500; }

/* palco */
.stage-wrap { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 18px; padding-block: 12px; }
.stage { position: relative; overflow-x: clip; overflow-y: visible; height: min(118vw, 470px, 58dvh); perspective: 1200px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.card { position: absolute; left: 50%; top: 50%; width: min(64vw, 300px); margin-left: calc(min(64vw, 300px) / -2);
  transform: translate(var(--x), -50%) scale(var(--s)); z-index: var(--z); opacity: var(--o);
  transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .4s ease, filter .4s ease; cursor: pointer;
  padding: 8px; border-radius: var(--r); background: linear-gradient(160deg, rgb(255 240 225 / .22), rgb(255 240 225 / .06));
  border: 1px solid var(--edge); backdrop-filter: blur(22px) saturate(170%); -webkit-backdrop-filter: blur(22px) saturate(170%);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .35), 0 30px 60px rgb(10 5 2 / .45); filter: brightness(var(--b)); }
.card.is-cur { cursor: default; }
.art { position: relative; aspect-ratio: 1; border-radius: 15px; overflow: hidden; display: grid; align-content: end; padding: 14px;
  background:
    radial-gradient(120% 90% at 20% 10%, rgb(255 255 255 / .28), transparent 45%),
    linear-gradient(150deg, var(--a1), var(--a2) 70%); }
.art::before { content: attr(data-mono); position: absolute; right: -6%; top: -12%; font-size: 120px; font-weight: 700; letter-spacing: -.06em;
  line-height: 1; color: rgb(255 255 255 / .13); }
.has-img .art { background-image: linear-gradient(180deg, rgb(0 0 0 / .25), transparent 30%, transparent 55%, rgb(0 0 0 / .6)), var(--img); background-size: cover, auto 134%; background-position: center; background-repeat: no-repeat; }
.has-img .art::before { display: none; }
.has-img .mini, .mini.has-img { background-image: var(--img-s); background-size: cover; background-position: center; color: transparent; }
.stage .video { position: absolute; z-index: 30; background: #000; border-radius: 15px; overflow: hidden; }
.stage .video iframe { width: 100%; height: 100%; border: 0; display: block; }
.pb.play { background: var(--fg); color: var(--ink); }
.pb.play:hover { background: var(--fg); }
.art .nr { position: absolute; left: 14px; top: 12px; font-weight: 600; font-size: 13px; color: rgb(255 255 255 / .8); font-variant-numeric: tabular-nums; }
.art .medley { position: relative; font-size: 13px; color: rgb(255 255 255 / .85); font-weight: 500; }
.cap { padding: 12px 6px 6px; text-align: center; }
.cap h3 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; text-wrap: balance;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cap p { margin: 2px 0 0; color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* detalhe da música atual */
.detail { display: grid; justify-items: center; gap: 10px; text-align: center; min-height: 64px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.voz { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 500;
  background: rgb(255 240 225 / .09); border: 1px solid var(--faint); cursor: pointer; }
.voz svg { opacity: .7; }
.tag { display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; background: rgb(255 240 225 / .09); border: 1px solid var(--faint); }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 7px; }
.t-ok { color: var(--ok); } .t-warn { color: var(--warn); } .t-bad { color: var(--bad); } .t-new { color: var(--new); } .t-info { color: var(--fg); }
.when { color: var(--muted); font-size: 13px; }
.when b { color: var(--fg); font-weight: 600; }
.note { max-width: 520px; margin: 0 auto; padding: 22px; border-radius: var(--r); text-align: center; font-size: 16px;
  background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
.note + .note { margin-top: 10px; }
.note small { display: block; color: var(--muted); margin-bottom: 6px; font-size: 13px; }

/* barra do player */
.bar { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 999px;
  background: linear-gradient(180deg, rgb(255 240 225 / .16), rgb(255 240 225 / .07)); border: 1px solid var(--edge);
  backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .28), 0 20px 50px rgb(8 4 2 / .5); }
.pb { width: 44px; height: 44px; border: 0; background: none; border-radius: 999px; display: grid; place-items: center; font-size: 20px; cursor: pointer; flex: none; }
.pb:hover { background: rgb(255 240 225 / .1); }
.pb:active { transform: scale(.92); }
.pb:disabled { opacity: .3; cursor: default; }
.now { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 999px; background: rgb(18 10 6 / .55); position: relative; overflow: hidden; }
.now .mini { width: 38px; height: 38px; border-radius: 10px; flex: none; background: linear-gradient(150deg, var(--a1), var(--a2)); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: rgb(255 255 255 / .9); }
.now .tx { min-width: 0; line-height: 1.2; }
.now b { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.now .prog { position: absolute; left: 50px; right: 14px; bottom: 4px; height: 2px; border-radius: 2px; background: var(--faint); }
.now .prog i { display: block; height: 100%; border-radius: 2px; background: var(--fg); width: var(--p); transition: width .4s ease; }
.links { display: flex; gap: 2px; }
.lk { height: 44px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--fg); }
.lk:hover { background: rgb(255 240 225 / .1); }
.lk svg { font-size: 20px; }
.sep { width: 1px; height: 24px; background: var(--faint); flex: none; }

/* painel (lista / agenda / busca) */
.sheet { position: fixed; inset: 0; z-index: 10; display: grid; align-items: end; background: rgb(8 4 2 / .45); }
.sheet[hidden] { display: none; }
.panel { width: 100%; max-width: 720px; margin: 0 auto; max-height: 84dvh; overflow: auto; overscroll-behavior: contain;
  border-radius: 28px 28px 0 0; padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  background: rgb(36 22 13 / .82); border: 1px solid var(--edge); border-bottom: 0;
  backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%); animation: up .35s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--faint); margin: 4px auto 10px; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: -8px; padding-block: 6px 10px; background: inherit; }
.ph h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
.find { display: flex; gap: 8px; margin-bottom: 12px; }
.find input, .find select { min-width: 0; flex: 1; height: 44px; border-radius: 14px; padding: 0 14px; font: 15px var(--font); color: var(--fg);
  background: rgb(255 240 225 / .08); border: 1px solid var(--faint); }
.find input::placeholder { color: var(--muted); }
.find select { flex: 0 1 38%; }
.grp { font-size: 13px; color: var(--muted); margin: 16px 4px 6px; font-weight: 500; }
.row { width: 100%; display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; text-align: left;
  padding: 8px; border-radius: 16px; background: none; border: 0; cursor: pointer; }
.row:hover, .row.cur { background: rgb(255 240 225 / .08); }
.row .mini { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; color: rgb(255 255 255 / .9); background: linear-gradient(150deg, var(--a1), var(--a2)); }
.row b { display: block; font-weight: 600; }
.row span { color: var(--muted); font-size: 13px; }
.row .tag { padding: 3px 9px; font-size: 12px; }
.meet .mini { flex-direction: column; line-height: 1; background: rgb(255 240 225 / .1); color: var(--fg); }
.meet .mini small { font-size: 10px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.meet.past { opacity: .5; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

.skel { width: min(64vw, 300px); aspect-ratio: .82; margin: 40px auto; border-radius: var(--r); background: var(--glass); border: 1px solid var(--edge); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 560px) {
  .lk .lbl { display: none; }
  .lk { padding: 0 10px; }
  .pb { width: 40px; height: 40px; }
  .now .mini { display: none; }
  .now { padding-left: 14px; }
  .now .prog { left: 14px; }
}
@media (min-width: 900px) {
  .stage { height: min(500px, 52dvh); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
@media (prefers-reduced-transparency: reduce) {
  .card, .bar-in, .panel, .icon-btn, .note { backdrop-filter: none; -webkit-backdrop-filter: none; background: #3a2416; }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="app">
  <div class="wrap">
    <header class="top">
      <h1 class="brand">Louvor Jovens <span class="sync" id="status">Carregando planilha…</span></h1>
      <div class="top-actions">
        <button class="icon-btn" id="btnSearch" type="button" aria-label="Buscar música"></button>
        <button class="icon-btn" id="btnAgenda" type="button" aria-label="Agenda"></button>
        <button class="icon-btn" id="refresh" type="button" aria-label="Atualizar"></button>
      </div>
    </header>
    <nav class="events" id="events" aria-label="Eventos"></nav>
  </div>

  <main class="stage-wrap" id="main">
    <div class="skel"></div>
  </main>
</div>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <button class="pb" id="prev" type="button" aria-label="Música anterior"></button>
    <button class="pb play" id="play" type="button" aria-label="Tocar"></button>
    <button class="pb" id="next" type="button" aria-label="Próxima música"></button>
    <div class="now" id="now"></div>
    <div class="links" id="links"></div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <div class="ph"><h2 id="sheetTitle"></h2><button class="icon-btn" id="close" type="button" aria-label="Fechar"></button></div>
    <div id="sheetBody"></div>
  </div>
</div>

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim()));
}

function kindOf(name) {
  const n = norm(name);
  if (n.includes("ensaio")) return "Ensaio";
  if (n.includes("culto")) return "Culto";
  if (n.includes("seminario")) return "Seminário";
  if (n.includes("precisar") || n.includes("reserva")) return "Reserva";
  if (n.includes("organiza")) return "Organização";

const DATE_NUM = /(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/;

  if (m) { let y = m[3] ? +m[3] : year; if (y < 100) y += 2000; return new Date(y, +m[2] - 1, +m[1]); }
  m = norm(name).match(DATE_TXT);
  if (m) return new Date(m[3] ? +m[3] : year, MONTHS.map(norm).indexOf(m[2]), +m[1]);
  return null;
}
function cleanName(name) {
  const t = name.replace(DATE_NUM, "").replace(new RegExp(`\\d{1,2}\\s+de\\s+(${MONTHS.join("|")})(\\s+de\\s+\\d{4})?`, "i"), "")
    .replace(/\s{2,}/g, " ").replace(/[-–:]\s*$/, "").trim();
  return t === t.toUpperCase() ? cap(t.toLowerCase()) : cap(t);

// Cada aba tem: título do mês, uma agenda opcional ("Encontros") e blocos de evento
// (linha com o nome do evento, cabeçalho N°/Música/... e as músicas ou um aviso).
function parseTab(rows, tab) {
  const events = [], agenda = [];
  let title = "", cols = null, cur = null, pending = null, inAgenda = false;
  const year = +((rows.flat().join(" ").match(/20\d{2}/) || [])[0] || new Date().getFullYear());
  const startEvent = name => {
    const e = { name, tab, songs: [], notes: [], kind: kindOf(name), date: dateOf(name, year) };
    e.label = cleanName(name) || e.kind;
    return e;
  };
  for (const r of rows) {
    const f = r.filter(Boolean);
    if (!f.length) continue;
    const lower = r.map(norm);
    const iMus = lower.findIndex(c => c === "musica" || c === "musicas");
    if (iMus >= 0) {
      inAgenda = false;
      cols = {
        n: lower.findIndex(c => c.startsWith("n") && c.length <= 3),
        musica: iMus,
        autor: lower.findIndex(c => c.includes("autor") || c.includes("banda") || c.includes("artista")),
        voz: lower.findIndex(c => c.startsWith("voz") || c.includes("vocal")),
        obs: lower.findIndex(c => c.startsWith("obs")),
        tom: lower.findIndex(c => c === "tom"),
        link: lower.findIndex(c => c.includes("link") || c.includes("cifra") || c.includes("youtube")),
      };
      cur = startEvent(pending || "Músicas"); events.push(cur); pending = null;
      continue;
    }
    if (f.length === 1 && !title && !events.length && !pending && !inAgenda && !agenda.length) { title = f[0]; continue; }
    if (f.length === 1 && /^(encontros|agenda|programa)/.test(norm(f[0]))) { inAgenda = true; cur = null; continue; }
    if (inAgenda && DATE_NUM.test(r[0])) {
      agenda.push({ date: dateOf(r[0], year), raw: r[0], what: r[1] || "", where: r[2] || "", time: r[3] || "", note: r.slice(4).filter(Boolean).join(", "), tab });
      continue;
    }
    if (f.length === 1) {
      if (cur && cols && cur.songs.length === 0 && !dateOf(f[0], year) && !/^(culto|ensaio|evento|seminario|louvor)/.test(norm(f[0]))) { cur.notes.push(f[0]); continue; }
      inAgenda = false; pending = f[0]; cur = null; continue;
    }
    if (cur && cols && r[cols.musica]) {
      const g = k => (cols[k] >= 0 ? r[cols[k]] : "") || "";
      cur.songs.push({ n: g("n"), musica: g("musica"), autor: g("autor"), voz: g("voz"), obs: g("obs"), tom: g("tom"), link: g("link") });
    } else if (cur && f.length > 1 && cols && !r[cols.musica] && cur.songs.length === 0) {
      cur.notes.push(f.join(", "));
    }
  }
  return { title, events: events.filter(e => e.songs.length || e.notes.length), agenda };
}

function statusClass(obs) {
  const o = norm(obs);
  if (o === "ok" || o.includes("pronto") || o.includes("fechad")) return "t-ok";
  if (o.includes("nao ensai") || o.includes("falta")) return "t-bad";
  if (o.includes("nova") || o.includes("novo")) return "t-new";
  if (o.includes("mais") || o.includes("ultimo") || o.includes("atencao")) return "t-warn";
  return "t-info";
}
const voices = v => v.split(/[\/,&]| e /).map(s => s.trim()).filter(Boolean);
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const fmtShort = d => d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
function relDays(d) {
  const diff = Math.round((d - today()) / 864e5);
  if (diff === 0) return "Hoje"; if (diff === 1) return "Amanhã";
  if (diff > 1 && diff < 14) return `Em ${diff} dias`;
  return "";
}
function nextEventIndex(events) {
  const t = today(); let best = -1;
  events.forEach((e, i) => { if (e.date && e.date >= t && (best < 0 || e.date < events[best].date)) best = i; });
  return best;
}

// Capa gerada a partir do nome da música: sempre a mesma cor para a mesma música.

// Vídeo do YouTube de cada música: usa o link da planilha se houver; senão o site procura

const ytQuery = s => `${s.musica.split("/")[0]} ${s.autor.split(/[\/,]/)[0]}`.trim();

function renderEvents() {

function meetFor(e) { return e && e.date && state.agenda.find(a => a.date && +a.date === +e.date); }

function layout() {

  const [a, b] = hues(title);
  document.documentElement.style.setProperty("--c1", a);
  document.documentElement.style.setProperty("--c2", b);
}

function go(i) {
  const e = state.events[state.ev]; if (!e) return;
  const next = Math.max(0, Math.min(e.songs.length - 1, i));
  if (next === state.song) return;
  state.song = next;
  layout();
  if (player.on) playCurrent();
}
function selectEvent(i, song = 0) {
  stopPlayer();
  state.ev = i; state.song = song;
  renderEvents(); renderStage();
}

/* player do YouTube: um único player fica sobre a capa do centro e só troca de vídeo,
   assim o navegador mantém o som liberado depois do primeiro toque */
const player = { on: false, yt: null, ready: false, paused: false, api: null, box: null };
function loadApi() {
  if (player.api) return player.api;
  player.api = new Promise(resolve => {
    if (window.YT && window.YT.Player) return resolve(window.YT);
    window.onYouTubeIframeAPIReady = () => resolve(window.YT);
    const sc = document.createElement("script");
    sc.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(sc);
  });
  return player.api;
}
function setPlayIcon() {
  const playing = player.on && !player.paused;
  $("#play").innerHTML = ico(playing ? "pause-fill" : "play-fill");
  $("#play").setAttribute("aria-label", playing ? "Pausar" : "Tocar");
}
function placeVideo() {
  const stage = $("#stage"), box = player.box, card = document.querySelector(`.card[data-i="${state.song}"]`);
  if (!stage || !box || !card) return;
  if (box.parentNode !== stage) stage.appendChild(box);
  const w = card.offsetWidth, h = card.offsetHeight;
  const left = (stage.clientWidth - w) / 2 + 9, top = stage.clientHeight / 2 - h / 2 + 9;
  Object.assign(box.style, { left: `${left}px`, top: `${top}px`, width: `${w - 18}px`, height: `${w - 18}px` });
}
function stopPlayer() {
  if (player.yt) { try { player.yt.destroy(); } catch (_) {} }
  if (player.box) player.box.remove();
  Object.assign(player, { yt: null, box: null, on: false, ready: false, paused: false });
  setPlayIcon();
}
function createPlayer(id) {
  const box = document.createElement("div"); box.className = "video";
  const slot = document.createElement("div"); box.appendChild(slot);
  player.box = box; placeVideo();
  player.yt = new YT.Player(slot, {
    videoId: id, width: "100%", height: "100%",
    playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: ev => { player.ready = true; ev.target.unMute(); ev.target.setVolume(100); ev.target.playVideo(); },
      onStateChange: ev => {
        if (ev.data === YT.PlayerState.PLAYING) { player.paused = false; setPlayIcon(); }
        if (ev.data === YT.PlayerState.PAUSED) { player.paused = true; setPlayIcon(); }
        if (ev.data === YT.PlayerState.ENDED) {
          const e = state.events[state.ev];
          if (e && state.song < e.songs.length - 1) go(state.song + 1); else stopPlayer();
        }
      },
    },
  });
}
// Chamado no toque do botão: quando a API e o vídeo já estão prontos, cria o player no mesmo
// toque (sem esperar nada), que é o que libera o som no celular.
function playCurrent() {
  const e = state.events[state.ev], idx = state.song, s = e && e.songs[idx];
  if (!s) return;
  const id = ytId(s);
  player.on = true; player.paused = false; setPlayIcon();
  if (id && window.YT && window.YT.Player) {
    if (player.yt && player.ready) { placeVideo(); player.yt.loadVideoById(id); player.yt.unMute(); return; }
    if (!player.yt) return createPlayer(id);
  }
  Promise.all([resolveYt([s]), loadApi()]).then(() => {
    if (!player.on || state.events[state.ev] !== e || state.song !== idx) return;
    const id2 = ytId(s);
    if (!id2) { stopPlayer(); return; }
    if (player.yt && player.ready) { placeVideo(); player.yt.loadVideoById(id2); }
    else if (!player.yt) createPlayer(id2);
  });
}
function togglePlay() {
  if (!player.on || !player.yt) return playCurrent();
  if (!player.ready) return;
  if (player.paused) { player.yt.unMute(); player.yt.playVideo(); } else player.yt.pauseVideo();
}
window.addEventListener("resize", placeVideo);

/* painel */
function openSheet(kind) { state.sheet = kind; renderSheet(); $("#sheet").hidden = false; }
function closeSheet() { state.sheet = null; $("#sheet").hidden = true; }
function songRow(s, ei, si, extra = "") {
  const parts = s.musica.split("/").map(p => p.trim()).filter(Boolean);
  const cur = ei === state.ev && si === state.song;
  return `<button type="button" class="row${cur ? " cur" : ""}" data-ev="${ei}" data-song="${si}" style="${artVars(s)}">
    <span class="mini${ytId(s) ? " has-img" : ""}">${esc(mono(s.musica))}</span>
    <span><b>${esc(parts.join(" / "))}</b><span>${esc([s.autor, s.voz].filter(Boolean).join(". "))}</span></span>
    ${s.obs ? `<span class="tag ${statusClass(s.obs)}">${esc(cap(s.obs))}</span>` : extra}
  </button>`;
}
function renderSheet() {
  const body = $("#sheetBody");
  if (state.sheet === "list") {
    const e = state.events[state.ev];
    $("#sheetTitle").textContent = e.label;
    body.innerHTML = e.songs.map((s, i) => songRow(s, state.ev, i)).join("");
  } else if (state.sheet === "agenda") {
    $("#sheetTitle").textContent = "Agenda";
    const t = today();
    const items = [...state.agenda].sort((a, b) => (a.date || 0) - (b.date || 0));
    body.innerHTML = items.length ? items.map(a => {
      const ev = state.events.findIndex(e => e.date && a.date && +e.date === +a.date);
      const rel = a.date ? relDays(a.date) : "";
      return `<button type="button" class="row meet${a.date && a.date < t ? " past" : ""}" ${ev >= 0 ? `data-ev="${ev}" data-song="0"` : "disabled"}>
        <span class="mini">${a.date ? a.date.getDate() : esc(a.raw)}<small>${a.date ? esc(a.date.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "")) : ""}</small></span>
        <span><b>${esc(a.what)}</b><span>${esc([a.date && cap(a.date.toLocaleDateString("pt-BR", { weekday: "long" })), a.time, a.where].filter(Boolean).join(", "))}${a.note ? `. ${esc(a.note)}` : ""}</span></span>
        ${rel ? `<span class="tag t-new">${rel}</span>` : ""}
      </button>`;
    }).join("") : `<div class="empty">Nenhum encontro na planilha.</div>`;
  } else if (state.sheet === "search") {
    $("#sheetTitle").textContent = "Buscar";
    const all = new Map();
    state.events.forEach(e => e.songs.forEach(s => voices(s.voz).forEach(v => all.set(norm(v), v))));
    const opts = [...all.values()].sort((a, b) => a.localeCompare(b, "pt-BR"));
    if (!$("#q")) {
      body.innerHTML = `<div class="find"><input id="q" type="search" placeholder="Música ou autor" aria-label="Música ou autor" autocomplete="off">
        <select id="voz" aria-label="Voz"><option value="">Todas as vozes</option>${opts.map(v => `<option value="${esc(norm(v))}">${esc(v)}</option>`).join("")}</select></div><div id="results"></div>`;
      $("#q").value = state.q; $("#voz").value = state.voz;
      $("#q").addEventListener("input", ev => { state.q = ev.target.value; renderResults(); });
      $("#voz").addEventListener("change", ev => { state.voz = ev.target.value; renderResults(); });
    }
    renderResults();
  }
}
function renderResults() {
  const q = norm(state.q), vz = state.voz;
  const match = s => (!q || norm(s.musica + " " + s.autor).includes(q)) && (!vz || voices(s.voz).some(v => norm(v) === vz));
  const order = state.events.map((e, i) => i).sort((a, b) => (state.events[b].date || 0) - (state.events[a].date || 0));
  let html = "";
  for (const i of order) {
    const e = state.events[i];
    const rows = e.songs.map((s, si) => match(s) ? songRow(s, i, si) : "").join("");
    if (rows) html += `<div class="grp">${esc(e.label)}${e.date ? `, ${esc(fmtShort(e.date))}` : ""}</div>${rows}`;
  }
  $("#results").innerHTML = html || `<div class="empty">Nada encontrado.</div>`;
}

/* dados */
async function fetchTab(name) {
  try {
    const r = await fetch(`/api/sheet?sheet=${encodeURIComponent(name)}`, { cache: "no-store" });
    if (r.ok && /csv/.test(r.headers.get("content-type") || "")) return await r.text();
  } catch (_) {}
  try {
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(name)}`, { cache: "no-store" });
    if (r.ok) return await r.text();
  } catch (_) {}
  if (window.EMBED_TABS && window.EMBED_TABS[name]) { window.IS_SNAPSHOT = true; return window.EMBED_TABS[name]; }
  return null;
}
// Abas que não existem fazem o Google devolver a primeira aba,
// então só aceitamos a resposta se o título dela citar o mês procurado.
async function fetchAll() {
  const results = await Promise.all(MONTHS.map(async m => {
    const csv = await fetchTab(m);
    if (!csv) return null;
    const rows = parseCSV(csv);
    if (!norm(rows.slice(0, 3).flat().join(" ")).includes(norm(m))) return null;
    return parseTab(rows, m);
  }));
  const tabs = results.filter(Boolean);
  if (!tabs.length) throw new Error("Não foi possível ler a planilha");
  return tabs;
}

async function load(first) {
  const btn = $("#refresh"); btn.classList.add("spin");
  try {
    const tabs = await fetchAll();
    const prev = state.events[state.ev]?.name, prevSong = state.song;
    state.events = tabs.flatMap(t => t.events);
    state.agenda = tabs.flatMap(t => t.agenda);
    const keep = state.events.findIndex(e => e.name === prev);
    if (!first && keep >= 0) { state.ev = keep; state.song = prevSong; } else { state.ev = pickDefault(state.events); state.song = 0; }
    renderEvents();
    if (!player.on) renderStage();
    if (state.sheet) renderSheet();
    $("#status").textContent = window.IS_SNAPSHOT ? "Prévia com os dados de 23/10" : "Atualizado às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    try { localStorage.setItem("louvor-cache-v3", JSON.stringify({ events: state.events, agenda: state.agenda })); } catch (_) {}
  } catch (err) {
    $("#status").textContent = "Sem conexão com a planilha";
    if (!state.events.length) $("#main").innerHTML = `<div class="wrap"><div class="note"><small>Não consegui carregar a planilha</small>Confira se ela está compartilhada como "Qualquer pessoa com o link" e toque em atualizar.</div></div>`;
  } finally { btn.classList.remove("spin"); }
}

/* ícones dos botões */
$("#btnSearch").innerHTML = ico("magnifying-glass");
$("#btnAgenda").innerHTML = ico("calendar-blank");
$("#refresh").innerHTML = ico("arrow-clockwise");
$("#close").innerHTML = ico("x");
$("#prev").innerHTML = ico("skip-back-fill");
$("#next").innerHTML = ico("skip-forward-fill");
$("#play").innerHTML = ico("play-fill");

/* eventos de interface */
$("#events").addEventListener("click", ev => { const b = ev.target.closest(".ev"); if (b) selectEvent(+b.dataset.i); });
$("#prev").addEventListener("click", () => go(state.song - 1));
$("#next").addEventListener("click", () => go(state.song + 1));
$("#play").addEventListener("click", togglePlay);
$("#now").addEventListener("click", () => openSheet("list"));
$("#btnSearch").addEventListener("click", () => openSheet("search"));
$("#btnAgenda").addEventListener("click", () => openSheet("agenda"));
$("#refresh").addEventListener("click", () => load(false));
$("#close").addEventListener("click", closeSheet);
$("#sheet").addEventListener("click", ev => {
  if (ev.target.id === "sheet") return closeSheet();
  const r = ev.target.closest(".row[data-ev]"); if (!r) return;
  selectEvent(+r.dataset.ev, +r.dataset.song); closeSheet();
});
$("#main").addEventListener("click", ev => {
  if (moved) return;
  const v = ev.target.closest(".voz");
  if (v) { state.q = ""; state.voz = norm(v.dataset.voz); $("#sheetBody").innerHTML = ""; openSheet("search"); return; }
  const c = ev.target.closest(".card"); if (c) go(+c.dataset.i);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && state.sheet) closeSheet();
  if (state.sheet || /input|select/i.test(document.activeElement.tagName)) return;
  if (ev.key === "ArrowRight") go(state.song + 1);
  if (ev.key === "ArrowLeft") go(state.song - 1);
});
// deslizar no carrossel
let sx = null, sy = 0, moved = false;
$("#main").addEventListener("pointerdown", ev => { if (ev.target.closest("#stage")) { sx = ev.clientX; sy = ev.clientY; moved = false; } });
window.addEventListener("pointerup", ev => {
  if (sx === null) return;
  const dx = ev.clientX - sx, dy = ev.clientY - sy; sx = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { moved = true; go(state.song + (dx < 0 ? 1 : -1)); setTimeout(() => moved = false, 50); }
});
window.addEventListener("resize", layout);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false); });

// Mostra a última versão salva enquanto busca a nova
try {
  const c = JSON.parse(localStorage.getItem("louvor-cache-v3") || "null");
  if (c && c.events) {
    c.events.forEach(e => e.date = e.date ? new Date(e.date) : null);
    c.agenda.forEach(a => a.date = a.date ? new Date(a.date) : null);
    state.events = c.events; state.agenda = c.agenda; state.ev = pickDefault(c.events);
    renderEvents(); renderStage();
  }
} catch (_) {}
load(true);
loadApi();
setInterval(() => { if (!document.hidden) load(false); }, 5 * 60000);
</script>
